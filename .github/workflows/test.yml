name: Installer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bash syntax and version
        run: |
          /bin/bash --version
          /bin/bash -n install.sh
      - name: Manifest consistency
        run: python3 scripts/update_manifest.py --check
      - name: Offline tests, including interactive pipe
        env:
          TEST_BASH: /bin/bash
        run: python3 -m unittest discover -s tests -v
